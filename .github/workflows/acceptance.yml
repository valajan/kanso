name: Acceptance

# Kanso end to end against the real landing page build: real Nuxt build, real
# Chrome and Lighthouse, and the CLI serving both builds itself — the same
# command the GitHub Action runs in a client's runner. Nothing is stood in. The
# suite and what each step asserts are described in
# test/acceptance/kanso-frontend.test.mjs.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/acceptance/**'
      - 'test/probes/**'
      - 'config.yml'
      - 'package-lock.json'
      - '.github/workflows/acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'test/acceptance/**'
      - 'test/probes/**'
      - 'config.yml'
      - 'package-lock.json'
      - '.github/workflows/acceptance.yml'
  # Weekly, so a Chrome, Lighthouse or landing page change that alters what
  # Kanso detects shows up even in a week with no Kanso commit.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running suite irrelevant.
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kanso-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out kanso
        uses: actions/checkout@v7
        with:
          path: kanso

      # The landing page is a public repository, so this needs no token and no
      # secret: a pull request from a fork checks it out exactly as a push to
      # main does, and runs the same suite.
      - name: Check out the landing page
        uses: actions/checkout@v7
        with:
          repository: valajan/kanso-landing
          path: kanso-landing

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            kanso/package-lock.json
            kanso-landing/package-lock.json

      - name: Install kanso
        working-directory: kanso
        run: npm ci

      - name: Install the landing page
        working-directory: kanso-landing
        run: npm ci

      # What the probes run inside a page, on pages with known answers: ten
      # seconds, and the quickest way to tell a probe that broke from a page
      # that changed. Chrome comes preinstalled on the runner image.
      - name: Run the probes against their pages
        working-directory: kanso
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:probes

      # The suite builds the landing page itself, so the audit always measures
      # the checked-out sources.
      - name: Run the acceptance suite
        working-directory: kanso
        env:
          CHROME_PATH: /usr/bin/google-chrome
          KANSO_FRONTEND_DIR: ../kanso-landing
        run: npm run test:acceptance
