# Drop-in workflow: deploy the preview, then audit it.
#
# The deploy step already knows the URL it just published, so it hands that to
# Kanso directly. Nothing has to be discovered from webhooks, which is what makes
# this work identically on any host — swap the deploy step for Vercel, Cloudflare
# Pages, Amplify, Railway or your own rsync, and the audit step is unchanged.
name: Performance

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Least privilege: Kanso posts as this job, so the job needs exactly the two
# permissions the report uses and nothing more.
permissions:
  contents: read
  pull-requests: write
  statuses: write

# A new push makes the previous audit irrelevant — stop it rather than queueing
# a second audit of a build nobody will merge.
concurrency:
  group: kanso-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- your existing build + deploy, unchanged --------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy preview
        id: deploy
        run: |
          url=$(npx netlify-cli deploy --dir=dist --json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).deploy_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # ---- the audit --------------------------------------------------------
      - name: Kanso performance audit
        uses: your-org/kanso-api/integrations/github-action@main
        with:
          preview-url: ${{ steps.deploy.outputs.url }}
          api-url: ${{ vars.KANSO_API_URL }}
          source: Netlify
          fail-on: fail
