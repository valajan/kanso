name: 'Kanso performance audit'
description: 'Audit a preview deployment with Lighthouse and report the result on the pull request.'
author: 'Kanso'

inputs:
  preview-url:
    description: 'URL of the preview deployment to audit.'
    required: true
  api-url:
    description: 'Kanso instance to call.'
    required: true
  token:
    description: >
      Token used both to prove write access and to post the report.
      The default GITHUB_TOKEN works, provided the job grants
      `pull-requests: write` and `statuses: write`.
    required: false
    default: ${{ github.token }}
  base-url:
    description: >
      Reference deployment to compare against. Prefer the base branch's own
      preview: comparing against production also measures the difference in
      hosting, not just the change under review.
    required: false
  source:
    description: 'Label shown in the report header.'
    required: false
    default: 'CI'
  config:
    description: 'Path to a .kanso.yml to send (defaults to ./.kanso.yml when present).'
    required: false
  fail-on:
    description: 'Fail the job on this verdict: fail | warn | never.'
    required: false
    default: 'fail'
  timeout:
    description: 'Seconds to wait for the verdict.'
    required: false
    default: '600'

runs:
  using: composite
  steps:
    - name: Run Kanso audit
      shell: bash
      env:
        KANSO_API_URL: ${{ inputs.api-url }}
        KANSO_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # github.sha on a pull_request event is the merge commit, which is not
        # the PR head Kanso audits and reports against.
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        node "${{ github.action_path }}/../kanso-audit.mjs" \
          --preview-url "${{ inputs.preview-url }}" \
          --source "${{ inputs.source }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --timeout "${{ inputs.timeout }}" \
          ${{ inputs.base-url && format('--base-url "{0}"', inputs.base-url) || '' }} \
          ${{ inputs.config && format('--config "{0}"', inputs.config) || '' }}
