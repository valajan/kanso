# GitLab CI equivalent. The audit step is byte-for-byte the same script as on
# GitHub Actions — only the surrounding YAML differs, which is the whole point
# of moving the trigger out of a GitHub App.
#
# CI_JOB_TOKEN cannot write merge request notes, so use a project access token
# with the `api` scope, stored as the masked CI variable KANSO_TOKEN.

stages: [deploy, audit]

deploy_preview:
  stage: deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - npm ci && npm run build
    - echo "PREVIEW_URL=$(./scripts/deploy-preview.sh)" >> deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

kanso_audit:
  stage: audit
  image: node:20-slim
  needs: [deploy_preview]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    # CI_COMMIT_SHA is the head of the source branch on a merge request pipeline.
    KANSO_API_URL: $KANSO_API_URL
  script:
    - >
      node integrations/kanso-audit.mjs
      --preview-url "$PREVIEW_URL"
      --token "$KANSO_TOKEN"
      --repo "$CI_PROJECT_PATH"
      --pr "$CI_MERGE_REQUEST_IID"
      --sha "$CI_COMMIT_SHA"
      --source "GitLab preview"
      --fail-on fail
