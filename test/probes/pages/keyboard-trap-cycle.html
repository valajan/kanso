<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus that goes round</title>
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; }</style>
</head>
<body>
<main>
  <h1>A widget that keeps focus, with no dialog to show for it</h1>
  <div class="widget">
    <button class="first">First</button>
    <button class="second">Second</button>
    <button class="last">Last</button>
  </div>
  <p><a href="#after">A link after the widget, never reached</a></p>
</main>
<script>
  document.querySelector('.last').addEventListener('keydown', (event) => {
    if (event.key === 'Tab' && !event.shiftKey) {
      event.preventDefault();
      document.querySelector('.first').focus();
    }
  });
</script>
</body>
</html>
