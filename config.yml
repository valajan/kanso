# ─────────────────────────────────────────────────────────────────────────────
# Static fallback configuration for PerfGuard.
#
# Each client repository can override any of these values by adding a
# .perfguard.yml file at the root of their repo. Missing keys fall back to
# the values defined here. budgets are merged key-by-key, so a client can
# override a single metric without restating the others.
# ─────────────────────────────────────────────────────────────────────────────

# URL of the production site used as the main branch reference.
base_url: https://perfbuddy.netlify.app/

# Delay in seconds before running Lighthouse on a PR preview.
# Netlify marks a deployment as "success" before all assets are fully served,
# so a small buffer avoids auditing a partially stale preview.
preview_wait_seconds: 15

# Performance budgets — hard limits that block a merge if exceeded.
# A PR worse than these values triggers a ❌ regardless of the prod reference.
# A PR within budget but worse than prod triggers a ⚠️.
# Omit a metric to disable its budget check.
budgets:
  performance: 80 # minimum Lighthouse score (0–100)
  lcp: 2.5 # maximum Largest Contentful Paint, in seconds
  tbt: 300 # maximum Total Blocking Time, in milliseconds
  cls: 0.1 # maximum Cumulative Layout Shift
  fcp: 1.8 # maximum First Contentful Paint, in seconds

# root-cause analysis on regressions
ai_analysis: true
