# ─────────────────────────────────────────────────────────────────────────────
# Static fallback configuration for Kanso.
#
# Each client repository can override any of these values by adding a
# .kanso.yml file at the root of their repo. Missing keys fall back to
# the values defined here, key by key at any depth, so a client can override a
# single budget or a single module setting without restating the others.
#
# Each audit module reads the section carrying its name — `accessibility:`,
# `seo:` and `best-practices:` below, and `performance:` if you prefer stating
# the budgets there. Performance came first and its `budgets:` still live at the
# root, where every .kanso.yml written so far keeps them; both forms work and
# the section wins.
# ─────────────────────────────────────────────────────────────────────────────

# Performance budgets — hard limits that block a merge if exceeded (❌).
# Values between the Lighthouse "good" threshold and this budget trigger a warning (⚠️).
# Defaults are set to Lighthouse "poor" zone boundaries so that green/orange/red
# matches the Lighthouse colour scale out of the box. Override in .kanso.yml
# to enforce stricter project-specific limits.
# All time-based metrics are in milliseconds.
budgets:
  performance: 49  # minimum Lighthouse score — below 50 is Lighthouse "poor"
  lcp: 4000        # maximum LCP in ms — above 4000ms is Lighthouse "poor"
  tbt: 600         # maximum TBT in ms — above 600ms is Lighthouse "poor"
  cls: 0.25        # maximum CLS — above 0.25 is Lighthouse "poor"
  fcp: 3000        # maximum FCP in ms — above 3000ms is Lighthouse "poor"
  inp: 500         # maximum INP in ms — above 500ms is "poor". Timed on the
                   # clicks `states:` declares (below): with none, not measured

# Accessibility — the axe rules Kanso runs on the page.
#
# fail_on is the impact from which a finding fails the audit: minor, moderate,
# serious or critical. Anything below it is reported as a warning.
#
# tags are the axe tags whose rules are run. The default is every WCAG A and AA
# criterion, in all three versions, plus the structural rules axe calls best
# practice — a page with no main landmark, a heading level skipped — which no
# criterion demands and every screen reader user feels. Narrow it to
# [wcag2a, wcag2aa] for the WCAG 2.0 set alone, or widen it with wcag2aaa. A
# tag axe does not know is ignored rather than obeyed: it would silently narrow
# the audit.
#
# What axe cannot settle on its own — text over a photograph, whose contrast no
# machine can compute — is reported too, marked "needs review", with its impact
# capped at moderate: a doubt is worth saying and must not fail an audit alone.
#
# A finding the reference page already has, on as many elements, is reported but
# never held against the change: with a reference, Kanso judges what the change
# did; without one — a local `kanso audit` with no --baseline — it judges the
# page as it stands, and every finding counts.
accessibility:
  fail_on: serious
  tags: [wcag2a, wcag2aa, wcag21a, wcag21aa, wcag22a, wcag22aa, best-practice]

# SEO and Best Practices — the other two Lighthouse categories. They report
# findings too, judged exactly like accessibility's, on the same impact scale:
# Lighthouse ranks none of their rules, so Kanso does (src/modules/seo/rules.js,
# src/modules/best-practices/rules.js). With `serious`, what fails is a page
# search engines are told to leave out or a broken canonical, a page not served
# over HTTPS or a field that refuses a paste; the rest warns.
#
# Any of the three sections takes an `ignore:` list of rules the project is not
# held to. Preview hosts — Vercel, Netlify, Cloudflare Pages — send
# `X-Robots-Tag: noindex` with every preview deployment, so a preview audited
# against production, or against nothing, fails `is-crawlable` every time:
#
#   seo:
#     ignore: [is-crawlable]
#
# A preview of the base branch carries the same header, which makes the finding
# inherited and needs no ignore.
seo:
  fail_on: serious

best-practices:
  fail_on: serious

# Interactions — what the states declared below leave behind when they close,
# and what opening and closing them again and again keeps in memory. Findings
# too, on the same scale (src/modules/interactions/rules.js): with `serious`,
# what fails is a page left locked, covered, or silent to a screen reader; a
# lost scroll position, a stale aria-expanded, an error on closing or a leak
# warns. Nothing is checked without a declared state.
interactions:
  fail_on: serious

# Number of Lighthouse runs per target, per form factor; the per-metric median
# is reported. A single run swings by 20-30% on TBT, which is enough on its own
# to fail a good change. 3 is the usual remedy; the cost is 3x the audit time.
# Max 5.
#
# It counts page loads, and one load feeds every module, so it belongs to the
# audit rather than to any module in it — hence the root, not a section.
runs: 1

# The states of the page beyond the one it loads in: a menu opened, a dialog
# shown, a form revealed — what only a click shows, and what a load alone never
# checks. Each is a name, the CSS selector of what to click to reach it, and
# optionally the selector of what says it has been reached; without one, Kanso
# waits for the page to go quiet. They are cumulative: each is reached from the
# one before, in the same page, as a visitor would.
#
#   states:
#     - name: menu
#       click: "[aria-label='Menu']"
#       wait_for: "#menu[aria-expanded='true']"
#     - name: signup
#       click: "#signup"
#
# Performance times each click, on a CPU slowed as Lighthouse slows it, and
# reports the slowest as the page's INP — Interaction to Next Paint, the Core
# Web Vital Lighthouse cannot measure on a load nobody clicks during.
#
# axe reads the page again in each, at no extra page load, and reports what
# each state shows broken that the ones before it did not, as
# `button-name @ menu`. A state that cannot be reached — its button renamed —
# is reported, with every state after it, as unchecked there, never as clean;
# on the reference, it leaves what the change shows there judged as it stands.
#
# At the root, like `runs:`: a state is a way through the page, not a setting
# of one module. None is declared by default.

# How to serve the project when `kanso audit`, `audit_page` or the GitHub Action
# is given no page: the directory the build writes, which Kanso serves itself,
# or the command the project serves itself with and the URL it serves at, which
# Kanso starts, waits for and stops. Relative to the .kanso.yml saying it.
# Kanso builds nothing: build first.
#
#   serve:                        serve:
#     dir: dist                     command: npm run preview
#                                   url: http://localhost:4173
